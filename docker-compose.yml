services:
  opal-backend:
    build: ./backend
    container_name: opal-backend
    ports:
      - "8000:8000"
    environment:
      - "DATABASE_URL=postgresql://${POSTGRES_USER:-opal}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@opal-db:5432/${POSTGRES_DB:-opal}"
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTH_ENABLED=true
      - KEYCLOAK_URL=http://opal-keycloak:8080
      - KEYCLOAK_ISSUER_URL=http://${EXTERNAL_HOSTNAME:-localhost}:8080
      - KEYCLOAK_REALM=opal
      - KEYCLOAK_CLIENT_ID=opal-frontend
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      # SÉCURITÉ (S03) : Le mot de passe admin Keycloak est obligatoire.
      # Le déploiement échoue si KEYCLOAK_ADMIN_PASSWORD n'est pas défini dans .env.
      # Générez un mot de passe fort : openssl rand -base64 32
      - "KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD est requis — définissez-le dans .env (openssl rand -base64 32)}"
      - KEYCLOAK_LDAP_ENABLED=${KEYCLOAK_LDAP_ENABLED:-false}
      - "SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}"
      - CORS_ORIGINS=http://${EXTERNAL_HOSTNAME:-localhost}:3000,http://${EXTERNAL_HOSTNAME:-localhost}:5173,http://localhost:3000,http://localhost:5173
      - OHDSI_IMAGE_PREFIX=ohdsi-docker
      - OHDSI_HOST_OUTPUT_DIR=${OHDSI_HOST_OUTPUT_DIR:-./ohdsi_output}
      - OHDSI_HOST_SCRIPTS_DIR=${OHDSI_HOST_SCRIPTS_DIR:-}
      - OHDSI_HOST_JDBC_DIR=${OHDSI_HOST_JDBC_DIR:-}
    depends_on:
      opal-db:
        condition: service_healthy
    volumes:
      - opal_data:/app/data
      # SÉCURITÉ (S01) : Le socket Docker n'est PAS monté ici.
      # Monter /var/run/docker.sock accorde une évasion de conteneur triviale
      # (toute RCE dans le backend → root sur l'hôte via `docker run --privileged`).
      #
      # Pour activer l'intégration OHDSI, utilisez un proxy Docker avec liste blanche
      # d'API plutôt que le socket brut. Exemple avec Tecnativa docker-socket-proxy :
      #
      #   docker-socket-proxy:
      #     image: tecnativa/docker-socket-proxy
      #     environment:
      #       CONTAINERS: 1   # autoriser docker ps / inspect
      #       IMAGES: 1       # autoriser docker pull
      #       POST: 1         # autoriser docker run / create
      #     volumes:
      #       - /var/run/docker.sock:/var/run/docker.sock:ro
      #
      # Puis montez le socket proxy dans le backend :
      #   - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # et supprimez le montage /var/run/docker.sock.
      - ./ohdsi_output:/app/ohdsi_output
      - ./backend/logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  opal-frontend:
    build: ./frontend
    container_name: opal-frontend
    ports:
      - "3000:80"
    depends_on:
      opal-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  opal-db:
    image: postgres:16-alpine
    container_name: opal-db
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-5434}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-opal}
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      - POSTGRES_DB=${POSTGRES_DB:-opal}
    volumes:
      - opal_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opal-keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: opal-keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      # SÉCURITÉ (S03) : identique à la section backend — mot de passe obligatoire.
      - "KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD est requis — définissez-le dans .env (openssl rand -base64 32)}"
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/opal-realm.json:/opt/keycloak/data/import/opal-realm.json:ro
      - ./keycloak/themes/opal:/opt/keycloak/themes/opal:ro
      - opal_keycloak_data:/opt/keycloak/data/h2
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  opal_pgdata:
  opal_data:
  opal_keycloak_data:

networks:
  default:
    name: opal-network
