services:
  opal-backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: opal-backend
    ports:
      - "8000:8000"
    environment:
      - "DATABASE_URL=postgresql://${POSTGRES_USER:-opal}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@opal-db:5432/${POSTGRES_DB:-opal}"
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTH_ENABLED=true
      - KEYCLOAK_URL=http://opal-keycloak:8080
      - KEYCLOAK_ISSUER_URL=http://${EXTERNAL_HOSTNAME:-localhost}:8080
      - KEYCLOAK_REALM=opal
      - KEYCLOAK_CLIENT_ID=opal-frontend
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      # SÉCURITÉ (S03) : Le mot de passe admin Keycloak est obligatoire.
      # Le déploiement échoue si KEYCLOAK_ADMIN_PASSWORD n'est pas défini dans .env.
      # Générez un mot de passe fort : openssl rand -base64 32
      - "KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD est requis — définissez-le dans .env (openssl rand -base64 32)}"
      - KEYCLOAK_LDAP_ENABLED=${KEYCLOAK_LDAP_ENABLED:-false}
      - "SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}"
      - CORS_ORIGINS=http://${EXTERNAL_HOSTNAME:-localhost}:3000,http://${EXTERNAL_HOSTNAME:-localhost}:5173,http://localhost:3000,http://localhost:5173
      # OHDSI: the backend is a thin client of opal-ohdsi-runner (no Docker socket).
      - OHDSI_MODE=${OHDSI_MODE:-off}
      - OHDSI_RUNNER_URL=http://opal-ohdsi-runner:9000
      - OHDSI_RUNNER_TOKEN=${OHDSI_RUNNER_TOKEN:-}
      # Cohort-LLM: thin client of opal-llm (off | embedded | on-premise).
      - COHORT_LLM_MODE=${COHORT_LLM_MODE:-off}
      - COHORT_LLM_URL=http://opal-llm:8001
      # SapBERT: thin client of opal-sapbert (off | on). On by default — shared embedder
      # for semantic mapping suggestions AND the cohort-llm RAG. Off => mapping keeps its
      # 5 other strategies and the cohort assistant loses concept-set auto-fill.
      - SAPBERT_MODE=${SAPBERT_MODE:-on}
      - SAPBERT_URL=http://opal-sapbert:8002
      - SAPBERT_RUNNER_TOKEN=${SAPBERT_RUNNER_TOKEN:-}
    networks:
      - default
      - ohdsi-net
      - sapbert-net
    depends_on:
      opal-db:
        condition: service_healthy
    volumes:
      - opal_data:/app/data
      - ./backend/logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  opal-frontend:
    build:
      context: ./frontend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: opal-frontend
    ports:
      - "3000:80"
    depends_on:
      opal-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  opal-db:
    image: postgres:16-alpine
    container_name: opal-db
    ports:
      - "${DB_EXTERNAL_PORT:-5434}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-opal}
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      - POSTGRES_DB=${POSTGRES_DB:-opal}
    volumes:
      - opal_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ⚠️  AVERTISSEMENT DÉVELOPPEMENT (S09) ──────────────────────────────────────
  # Ce fichier compose utilise `start-dev` pour Keycloak (mode développement).
  # Il N'EST PAS adapté à un déploiement en production sans modifications.
  # En production, utilisez docker-compose.prod.yml qui :
  #   • Remplace `start-dev` par `start` (mode production durci)
  #   • Configure KC_HOSTNAME, KC_HTTPS_*, et un vrai magasin de clés TLS
  #   • Peut exposer Keycloak derrière un reverse-proxy (nginx/traefik)
  # ─────────────────────────────────────────────────────────────────────────────
  opal-keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: opal-keycloak
    user: "0:0"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      # SÉCURITÉ (S03) : identique à la section backend — mot de passe obligatoire.
      - "KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD est requis — définissez-le dans .env (openssl rand -base64 32)}"
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
    command: start-dev --import-realm
    ports:
      # SÉCURITÉ (S09) : port Keycloak lié à 127.0.0.1 uniquement.
      # Pour autoriser l'accès depuis d'autres machines (ex: SSO multi-hôte),
      # remplacez par "0.0.0.0:8080:8080" et ajoutez un reverse-proxy devant.
      - "8080:8080"
    volumes:
      - ./keycloak/opal-realm.json:/opt/keycloak/data/import/opal-realm.json:ro
      - ./keycloak/themes/opal:/opt/keycloak/themes/opal:ro
      - opal_keycloak_data:/opt/keycloak/data/h2
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # OHDSI runner — opt-in via the "ohdsi" profile and OHDSI_MODE=on.
  #   docker compose --profile ohdsi up -d
  # Runs the OHDSI R tools as subprocesses (no Docker socket). Lives on a
  # dedicated network with egress to the external OMOP DB only — it cannot
  # reach opal-db or keycloak.
  opal-ohdsi-runner:
    build:
      context: ./ohdsi-tools
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: opal-ohdsi-runner
    profiles: ["ohdsi"]
    environment:
      # Token partagé backend<->runner. NE PAS utiliser `:?` ici : Compose
      # interpole tout le fichier (même les services hors profil) pour TOUTE
      # commande (down/up/ps...), donc un `:?` ferait échouer ces commandes
      # pour quiconque n'active pas OHDSI. L'obligation du token est appliquée
      # au runtime : le runner refuse toute route si le token est vide
      # (server.py) et le backend bloque en prod si OHDSI_MODE=on sans token
      # (config.py). Générer avec: openssl rand -hex 32
      - OHDSI_RUNNER_TOKEN=${OHDSI_RUNNER_TOKEN:-}
      - OHDSI_MAX_CONCURRENT_JOBS=${OHDSI_MAX_CONCURRENT_JOBS:-2}
    volumes:
      - opal_ohdsi_data:/data
    networks:
      - ohdsi-net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Cohort-LLM service (natural-language -> cohort draft). Opt-in via the
  # "cohort-llm" profile and COHORT_LLM_MODE. Runs the e5 RAG over OPAL's
  # source_value_cache in BOTH modes; the generation model differs:
  #   embedded   -> Ollama pulls the model on first run (opal_llm_models volume)
  #   on-premise -> no Ollama; the backend passes an external OpenAI-compatible LLM
  #   docker compose --profile cohort-llm up -d
  opal-llm:
    build:
      context: ./cohort-llm
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: opal-llm
    profiles: ["cohort-llm"]
    environment:
      - COHORT_LLM_MODE=${COHORT_LLM_MODE:-off}
      - COHORT_LLM_EMBEDDED_MODEL=${COHORT_LLM_EMBEDDED_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      - COHORT_LLM_DEVICE=${COHORT_LLM_DEVICE:-cuda}
      # Reads source_value_cache from opal-db to build per-CDM RAG indexes.
      - COHORT_LLM_DB_URL=postgresql://${POSTGRES_USER:-opal}:{pw}@opal-db:5432/${POSTGRES_DB:-opal}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - OLLAMA_MODELS=/models
      - COHORT_LLM_INDEX_CACHE=/app/index_cache
      # RAG embeddings come from the shared opal-sapbert runner (the SAME service the
      # mapping uses — one medical embedder in VRAM). If SapBERT is off/down, retrieval
      # is unavailable (criteria extraction still works). See SAPBERT_MODE.
      - SAPBERT_URL=http://opal-sapbert:8002
      - SAPBERT_RUNNER_TOKEN=${SAPBERT_RUNNER_TOKEN:-}
    volumes:
      - opal_llm_models:/models        # embedded model, pulled on first run
      - opal_llm_index:/app/index_cache # per-CDM RAG indexes
    networks:
      - default                         # needs opal-db for the source_value_cache
      - sapbert-net                     # reaches opal-sapbert /encode for RAG embeddings
    depends_on:
      opal-db:
        condition: service_healthy
      opal-sapbert:
        condition: service_started
    # GPU (host needs the NVIDIA container runtime). Set COHORT_LLM_DEVICE=cpu to skip.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # SapBERT runner — ON BY DEFAULT (shipped .env sets COMPOSE_PROFILES=sapbert).
  # Independent module, orthogonal to COHORT_LLM_MODE: it is the shared medical
  # embedder for BOTH mapping suggestions (POST /index + /match -> sapbert_mappings)
  # AND the cohort-llm RAG (POST /encode). To disable: drop "sapbert" from
  # COMPOSE_PROFILES and set SAPBERT_MODE=off (see .env.example for the impact).
  # Pure compute with the multilingual SapBERT model baked into the image: NO DB and
  # NO CDM access — clients feed it data over HTTP. Its only persistent store is the
  # opal_sapbert_cache VOLUME (files: per-(cdm,domain) target embeddings), NOT the app
  # database. Lives on a dedicated network reachable only by the backend and opal-llm.
  opal-sapbert:
    build:
      context: ./sapbert-tools
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        # Baked model must match SAPBERT_MODEL at runtime, else it re-downloads.
        SAPBERT_MODEL: ${SAPBERT_MODEL:-cambridgeltl/SapBERT-UMLS-2020AB-all-lang-from-XLMR}
    container_name: opal-sapbert
    profiles: ["sapbert"]
    environment:
      # Shared token backend<->runner. Same rationale as OHDSI: no `:?` here
      # (Compose interpolates every service for any command); enforced at runtime
      # (when set, server.py rejects requests with a wrong/missing token; the
      # backend blocks in prod if MODE=on without a token. With an empty token the
      # runner accepts any request — safe only because it lives on an internal,
      # backend-only network). Generate with: openssl rand -hex 32
      - SAPBERT_RUNNER_TOKEN=${SAPBERT_RUNNER_TOKEN:-}
      - SAPBERT_MODEL=${SAPBERT_MODEL:-cambridgeltl/SapBERT-UMLS-2020AB-all-lang-from-XLMR}
      - SAPBERT_DEVICE=${SAPBERT_DEVICE:-cuda}
      - SAPBERT_BATCH_SIZE=${SAPBERT_BATCH_SIZE:-128}
    volumes:
      - opal_sapbert_cache:/cache       # per-(cdm,domain) target embeddings (files, not a DB)
    networks:
      - sapbert-net
    # GPU (host needs the NVIDIA container runtime). Set SAPBERT_DEVICE=cpu to skip.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  opal_pgdata:
  opal_data:
  opal_keycloak_data:
  opal_ohdsi_data:
  opal_llm_models:
  opal_llm_index:
  opal_sapbert_cache:

networks:
  default:
    name: opal-network
  ohdsi-net:
    name: opal-ohdsi-network
  sapbert-net:
    name: opal-sapbert-network
