services:
  opal-backend:
    build: ./backend
    container_name: opal-backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-opal}:${POSTGRES_PASSWORD:-opal}@opal-db:5432/${POSTGRES_DB:-opal}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - KEYCLOAK_URL=http://opal-keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-opal}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-opal-frontend}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - OHDSI_IMAGE_PREFIX=${OHDSI_IMAGE_PREFIX:-ohdsi-docker}
      - OHDSI_HOST_OUTPUT_DIR=${OHDSI_HOST_OUTPUT_DIR:-}
      - OHDSI_HOST_SCRIPTS_DIR=${OHDSI_HOST_SCRIPTS_DIR:-}
      - OHDSI_HOST_JDBC_DIR=${OHDSI_HOST_JDBC_DIR:-/data/jdbc_drivers}
    depends_on:
      opal-db:
        condition: service_healthy
    volumes:
      - opal_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ohdsi_output:/app/ohdsi_output
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  opal-frontend:
    build: ./frontend
    container_name: opal-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      opal-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  opal-db:
    image: postgres:16-alpine
    container_name: opal-db
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-opal}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-opal}
      - POSTGRES_DB=${POSTGRES_DB:-opal}
    volumes:
      - opal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opal}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opal-keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: opal-keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_HOSTNAME=${KC_HOSTNAME:-localhost}
      - KC_HOSTNAME_PORT=${KC_HOSTNAME_PORT:-8080}
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/opal-realm.json:/opt/keycloak/data/import/opal-realm.json:ro
      - ./keycloak/themes/opal:/opt/keycloak/themes/opal:ro
      - opal_keycloak_data:/opt/keycloak/data/h2
    restart: unless-stopped

volumes:
  opal_pgdata:
  opal_data:
  opal_keycloak_data:

networks:
  default:
    name: opal-network
